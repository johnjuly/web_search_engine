<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网页快照</title>
  </head>
  <body>
    <h1>网页快照</h1>
    <p>
      <strong>原始 URL:</strong>
      <a href="{{ url }}" target="_blank">{{ url }}</a>
    </p>
    <p><strong>快照时间:</strong> {{ snapshot_date }}</p>
    <hr />
    <div id="snapshot-content">
      <iframe
        srcdoc="{{ raw_html | safe }}"
        style="width: 100%; height: 80vh; border: none"
      ></iframe>
    </div>
  </body>
</html>
